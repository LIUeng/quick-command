name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version and updater credentials
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          pnpm version:check -- "${EXPECTED_VERSION#v}"
          test -n "$UPDATER_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY secret"; exit 1; }
          test -n "$UPDATER_PUBLIC_KEY" || { echo "Missing TAURI_SIGNING_PUBLIC_KEY variable"; exit 1; }

      - name: Prepare updater release configuration
        env:
          QUICK_COMMAND_UPDATER_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: pnpm release:config

      - name: Build signed updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          QUICK_COMMAND_UPDATER_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Quick Command v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin --config src-tauri/tauri.release.generated.conf.json
